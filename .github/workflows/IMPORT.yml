name: Import Cart ZIP and Build APK

on:
  push:
    branches: [main]
    paths:
      - 'RustNRum-Cart-app-Android-*-source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f \
            -name 'RustNRum-Cart-app-Android-*-source.zip' \
            -printf '%f\n' | sort -V | tail -n 1)

          test -n "$ZIP"
          unzip -tq "$ZIP"

          mkdir -p "$RUNNER_TEMP/cart-import"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/cart-import"

          SOURCE="$RUNNER_TEMP/cart-import/RustNRum-Cart-app"

          test -f "$SOURCE/settings.gradle.kts"
          test -f "$SOURCE/app/build.gradle.kts"
          test -f "$SOURCE/app/src/main/AndroidManifest.xml"

          rsync -a "$SOURCE/" "$GITHUB_WORKSPACE/"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustNRum-Cart-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- "$SOURCE_ZIP"
          git add -A
          git diff --cached --quiet || git commit -m 'Import Android source'
          git push origin HEAD:main
